name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-release-version.mjs
      - id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: npm run android:sync
      - run: gradle -p android assembleRelease
      - name: Stage APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist-apk/Nearbox-${{ needs.version.outputs.version }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-apk/*.apk

  windows:
    needs: [version, android]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: resources
      - name: Embed matching APK
        shell: pwsh
        run: |
          $apk = Get-ChildItem resources -Filter *.apk | Select-Object -First 1
          if (-not $apk) { throw "missing android apk" }
          Copy-Item $apk.FullName resources/nearbox.apk -Force
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/*.zip

  publish:
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.version.outputs.version }}"
          mapfile -t files < <(find artifacts -type f \( -name '*.apk' -o -name '*.exe' -o -name '*.zip' \))
          gh release create "v${version}" "${files[@]}" \
            --title "Nearbox v${version}" \
            --notes "手机记想法，电脑跑 Agent。Windows 安装包内含同版本 Android 薄壳；手机界面由电脑下发，更新电脑即可，只有壳本身变了才需要重装 APK。" \
            --verify-tag
