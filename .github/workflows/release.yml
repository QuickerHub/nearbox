name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-release-version.mjs
      - id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: npm run android:sync
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "缺少 ANDROID_KEYSTORE_BASE64。正式包必须用固定签名，否则每次 CI 的调试证书都不同，手机无法覆盖安装。"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/release.keystore"
      - name: Assemble signed release
        env:
          ANDROID_KEYSTORE: ${{ github.workspace }}/android/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease
      - name: Verify APK certificate
        run: |
          expected="$(tr -d ' \r\n' < android/release-cert.sha256)"
          actual="$(keytool -printcert -jarfile android/app/build/outputs/apk/release/app-release.apk | awk '/SHA256:/{print $2; exit}')"
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "APK 签名是 $actual，期望 $expected"
            exit 1
          fi
      - name: Stage APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist-apk/Nearbox-${{ needs.version.outputs.version }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-apk/*.apk

  windows:
    needs: [version, android]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: resources
      - name: Embed matching APK
        shell: pwsh
        run: |
          $apk = Get-ChildItem resources -Filter *.apk | Select-Object -First 1
          if (-not $apk) { throw "missing android apk" }
          Copy-Item $apk.FullName resources/nearbox.apk -Force
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/*.zip

  publish:
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.version.outputs.version }}"
          mapfile -t files < <(find artifacts -type f \( -name '*.apk' -o -name '*.exe' -o -name '*.zip' \))
          gh release create "v${version}" "${files[@]}" \
            --title "Nearbox v${version}" \
            --notes "手机记想法，电脑跑 Agent。装好之后在「设置」里检查更新、下载并安装，不用再去 GitHub。Android 薄壳用固定签名打包，之后可以直接覆盖安装；如果从旧版升级提示签名不同，先卸载再装这一次即可。" \
            --verify-tag
