appId: com.quickerhub.nearbox
productName: Nearbox
copyright: Copyright © QuickerHub
artifactName: Nearbox-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**/*
extraResources:
  - from: resources
    to: .
    filter:
      - nearbox.apk
      - icons/**
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  signAndEditExecutable: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Nearbox
asar: true
